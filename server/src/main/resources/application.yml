server:
  port: 8080
  # 绑定所有网络接口：确保手机同网段可访问后端
  address: 0.0.0.0
  servlet:
    encoding:
      # wx.uploadFile 按响应头里的 charset 解码响应体，缺省 charset 时中文报错信息会被
      # 按 Latin-1 解码成乱码（如"仅支持上传…"变成 ä»…æ"¯æŒ…），故强制响应携带 UTF-8
      charset: UTF-8
      force: true

spring:
  # 排除 Spring AI OpenAI 自动配置（模型 Bean 在 AiConfig 手动构建，base-url 区分 deepseek/智谱）
  # 排除 Redis Repository 自动配置（仅用 StringRedisTemplate 存会话/限流，JPA Repository 不受扫描干扰）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  application:
    name: community-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/community_platform
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql,classpath:db/alter.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    property-naming-strategy: LOWER_CAMEL_CASE

  servlet:
    multipart:
      # 知识文档上传（扫描版 PDF 可达 20-30MB）：单文件 20MB，整体请求 40MB
      max-file-size: 20MB
      max-request-size: 40MB

  # Redis — Agent 热会话 + 限流（Docker community-redis 容器）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # Security 过滤器仅在 REQUEST/ERROR dispatch 执行，排除 ASYNC——
  # 否则 SseEmitter 异步写流时 SecurityContext 未传播会导致 AccessDenied（响应已提交无法改状态码）
  security:
    filter:
      dispatcher-types: request, error

# 微信小程序配置（真机调试 / 生产环境必须配置）
wechat:
  miniapp:
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_SECRET:}

# JWT 配置
jwt:
  # 由 JWT_SECRET 环境变量注入（密钥不提交仓库）；生产必须提供至少 256 位随机密钥并定期轮换。
  secret: ${JWT_SECRET}
  expiration: 604800000 # 7天

# 文件上传路径
file:
  upload-dir: ./uploads
  # 知识库源文档独立目录（不落 /uploads 静态区，防止源文件被公开访问）
  knowledge-dir: ./knowledge-docs

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG

# AI 配置
ai:
  # 智谱 Embedding — 语义向量（RAG 用 dimensions=1024，与 idle_items 的 2048 区分）
  embedding:
    api-key: ${BIGMODEL_EMBEDDING3_KEY:your-api-key}
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: embedding-3
    similarity-threshold: 0.25
  # 智谱视觉模型 — 仅图片审核（deepseek 无视觉模型）
  zhipu:
    chat:
      api-key: ${BIGMODEL_EMBEDDING3_KEY:your-api-key}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model-vision: glm-4v-flash
  # 独立重排服务（rerank-service Docker 容器，bge-reranker-v2-m3 / FastAPI）
  # 必须用 127.0.0.1 而非 localhost：Java 解析 localhost 优先 IPv6(::1)，会打到 WSL 的 8001 而非 Docker 端口映射
  rerank:
    base-url: http://127.0.0.1:8001
    model: bge-reranker-v2-m3
  # DeepSeek 文本模型 — 文本生成/审核/Agent 对话（通用 OpenAI ChatModel 对接）
  # 注意：禁止引入 spring-ai-starter-model-deepseek（Function Call 会失效），统一走 OpenAI 兼容
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-api-key}
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
  # Agent 助手配置（小邻）
  agent:
    max-turns: 10 # 会话历史保留轮数（1 次用户提问 + agent 回复 = 1 轮）
    max-history-chars: 6500 # 历史序列化最大字符数（约 6.5k token；超限从头部裁剪至少保留 6 条）
    max-tool-rounds: 3 # 工具调用最大轮次，超限强制终止防死循环
    rate-limit-per-minute: 10
    rate-limit-per-day: 100
    session-ttl-hours: 24
    session-lock-timeout-ms: 5000 # 热会话进程内锁等待上限（超时抛 BizException 明确失败，不再降级不加锁执行）
    knowledge-top-k: 5
    # 语义相似度阈值（余弦距离）：原 0.45 按书面语料标定，对口语化提问过严，实测约 1/4 查询零召回。
    # 30 条评测集实测（工具见 RetrievalEval，含上下游降级差异，同配置多次运行波动约 3~5 个百分点）：
    # 放宽至 0.80 后 Hit@3 由 70% 升至 80%、MRR 由 0.70 升至 0.80、零召回由 7 条降至 0，
    # 且 Precision@3 由 27.8% 升至 31.1%（精度主要由下游 knowledge-min-score 重排关卡控制，故放宽未引入噪声）。
    # 注：Precision@3 偏低源于重排关卡严格、多数查询仅返回 1 条命中，非检索质量问题。
    knowledge-threshold: 0.80
    # 知识检索重排相关性分数关卡：低于此分数的候选被过滤（searchForAgent 工具专用，防幻觉）
    knowledge-min-score: 0.3
    # 单轮对话工具调用次数上限：达到后工具返回「已达到本轮工具调用上限」，防死循环
    max-tool-calls: 5
    archive-idle-minutes: 15 # 空闲归档阈值
    archive-turn-count: 10 # 归档轮次阈值（达到 10 轮问答即归档；内部 ×2 换算为 20 条消息，与 max-turns×2 截断封顶一致）
    archive-keep-turns: 3 # 归档后保留轮数（热会话留作继续对话的上下文）。须小于 archive-turn-count：配大了会话会一直顶在截断上限，先丢弃未归档的消息、每轮只能归档 1 条
    # 长期记忆检索：新窗口开始检索用户压缩段 top-N 并注入 {历史记忆}
    memory-recall-top: 3 # 记忆召回条数（检索该用户压缩段 top-N）
    # 记忆匹配距离阈值（余弦距离，≤ 此值才注入）。与知识库不同：记忆摘要是 LLM 压缩产物，
    # 指代/措辞差异的语义距离更大——实测「我喜欢什么动物」→「用户喜欢翼龙」=0.48、相关 0.26~0.50、
    # 不相关 0.59+，故取 0.55（知识库保留 0.45）
    memory-match-threshold: 0.55
    tool-mode: native # 工具模式：native(原生 tool calling，PoC 已验证) / json(JSON 意图兜底)
    max-tokens: 2048 # 对话回复最大 token（reasoning 思维链占用大，512 实测 content 为空；2048 支撑 500 字 Markdown 排版回复）
    temperature-knowledge: 0.2 # RAG 精准检索温度
    temperature-creative: 0.6 # 创意文案温度（PolishingClient 互助感想保持 0.7 不动）
  # 内容审核重试配置（线程池满时被拒任务暂存 Redis，由定时任务分钟级重投）
  moderation:
    retry-batch: 5 # 单轮最多重投条数（实际还会被池子当前剩余容量钳制）
    retry-max-attempts: 3 # 最大重试次数，超过则不再入队、交回每日巡检兜底
    retry-backoff-ms: 30000 # 退避基数（毫秒），第 n 次重试等待 base × 2^(n-1)
  # 文档导入解析配置（RAG 数据源：B端上传 → 解析 → 切片 → 嵌入）
  doc:
    chunk-size: 400 # 切片目标长度（字符），按行贪心累加达到后封卡
    chunk-max: 550 # 切片硬上限（字符），超长单行按此滑动窗口切
    chunk-overlap: 60 # 滑窗切片重叠字符数
    min-chunk-length: 20 # 最短有效切片，低于此丢弃
    rows-per-chunk: 20 # Excel/CSV 每组行数
    recall-top-k: 8 # 混合召回条数（向量 ∪ 关键词）
    rerank-top-m: 3 # 重排后注入 prompt 条数（searchForAgent 工具 top-3）
    ocr-max-pages: 20 # 扫描版 PDF OCR 页数上限，超限页跳过并记录 warning
    ocr-scan-threshold: 20 # 单页抽取文本量低于此字符数判定为扫描页
    ocr-dpi: 150 # PDF 渲染 OCR 分辨率（纯图片页自动提至 200）
    embedding-batch-size: 16 # embedding 批量条数
    embedding-delay-ms: 200 # 批量间节流延迟
    cleanup-retention-hours: 24 # 失败/中断源文件保留时长，超时由定时任务清理
    kb-block-max-chars: 1500 # 注入 prompt 的 KB 块总字符上限
